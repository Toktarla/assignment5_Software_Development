apiVersion: apps/v1
kind: Deployment
metadata:
  name: qogam-sentiment
  labels:
    app: qogam-sentiment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qogam-sentiment
  template:
    metadata:
      labels:
        app: qogam-sentiment
    spec:
      containers:
        - name: api
          image: docker.io/library/qogam-sentiment:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 8
            periodSeconds: 10
